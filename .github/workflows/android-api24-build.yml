name: Android API 24 release 1.1.1
on:
  push:
    branches: [codex/android-api24-release]
    paths: [.github/workflows/android-api24-build.yml]
permissions:
  contents: read
jobs:
  release:
    uses: ./.github/workflows/android-release.yml
    with:
      version_name: '1.1.1'
      version_code: '4'
    secrets: inherit
