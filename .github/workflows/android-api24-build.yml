name: Android API 24 release 1.1.2
on:
  push:
    branches: [codex/play-package-fix]
    paths: [.github/workflows/android-api24-build.yml]
permissions:
  contents: read
jobs:
  release:
    uses: ./.github/workflows/android-release.yml
    with:
      version_name: '1.1.2'
      version_code: '5'
    secrets: inherit
