name: Android API 24 release 1.1.3
on:
  push:
    branches: [codex/firebase-android-push]
    paths: [.github/workflows/android-api24-build.yml]
permissions:
  contents: read
jobs:
  release:
    uses: ./.github/workflows/android-release.yml
    with:
      version_name: '1.1.3'
      version_code: '6'
    secrets: inherit
