name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: quran_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quran_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CORS_ORIGINS: http://127.0.0.1:4173
      NODE_ENV: test
      JWT_ACCESS_SECRET: test-only-key-for-ci-with-no-production-access-123456789
      DATABASE_URL: postgresql://postgres@localhost:5432/quran_test?schema=public
      DIRECT_URL: postgresql://postgres@localhost:5432/quran_test?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: node backend/scripts/check-secrets.mjs --history
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm audit --prefix backend --omit=dev --audit-level=moderate
      - run: npm audit --prefix frontend --omit=dev --audit-level=moderate
      - name: Verify Quran heart progression rules
        run: npm --prefix frontend run test:achievements
      - run: npm --prefix frontend run test:offline
      - run: npm --prefix frontend run test:full-offline
      - run: npm --prefix frontend run test:local-security
      - run: npm --prefix frontend run test:notification-sounds
      - run: npm --prefix frontend run test:sound-channels
      - run: npm --prefix frontend run test:adhan
      - run: backend/node_modules/.bin/prisma generate --schema backend/prisma/schema.prisma
      - name: Verify Mushaf assets and scoring rules
        run: |
          node scripts/verify-mushaf.mjs
          cd backend
          node --test -r ts-node/register src/common/learning-rules.test.ts
      - run: npm --prefix backend run test:achievements
      - run: npm --prefix backend run test:honor-roll
      - run: npm --prefix backend run test:founder
      - run: npm --prefix backend run test:founder-audit
      - name: Test UI domain and contact policies
        run: node --test -r ts-node/register src/community/community-policy.test.ts src/community/community-audience.test.ts src/community/profile-cover.test.ts
        working-directory: backend
      - run: npm --prefix backend run test:security
      - run: npm --prefix backend run test:sms
      - run: npm --prefix backend run test:student-transfer
      - run: npm --prefix backend run test:production-start
      - run: npm --prefix backend run test:realtime-sync
      - run: npm --prefix backend run test:full-offline
      - run: npm --prefix backend run test:domain-safety
      - run: npm --prefix backend run test:offline-sync
      - run: npm --prefix backend run test:sync-protocol
      - run: npm --prefix backend run test:attendance-replay
      - run: npm --prefix backend run prisma:deploy
      - name: Verify additive SMS schema recovery on disposable PostgreSQL
        working-directory: backend
        run: node --test -r ts-node/register src/notifications/sms-schema.integration.test.ts
      - name: Verify learning snapshots and points on PostgreSQL
        working-directory: backend
        run: node --test -r ts-node/register src/recitations/learning.integration.test.ts
      - name: Verify parent retirement on disposable PostgreSQL
        run: node scripts/student-transfer.integration.mjs
        working-directory: backend
      - run: node --test -r ts-node/register src/founder/founder.integration.test.ts
        working-directory: backend
      - run: node scripts/recovery.integration.mjs
        working-directory: backend
      - run: npm --prefix backend run test:api-integration
      - run: npm --prefix backend run test:journal-order-integration
      - run: npm --prefix backend run test:sync-push-integration
      - run: npm --prefix backend run test:attendance-lock-integration
      - run: npm --prefix backend run test:backup-restore
      - run: npm --prefix backend run build
      - run: node scripts/runtime-start.integration.mjs
        working-directory: backend
      - run: npm --prefix frontend run build
        env:
          NODE_ENV: production
      - run: node backend/scripts/e2e-fixtures.mjs
      # Browser OS dependencies can take longer on a cold GitHub-hosted runner.
      # Allow the apt install to finish instead of failing before browser tests start.
      - run: npx --prefix frontend playwright install --with-deps chromium
        timeout-minutes: 15
      - name: Verify mobile social workflows
        run: npm --prefix frontend run test:e2e -- --grep 'community composer|selected post composer|mobile account|native-style settings'
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: |
            frontend/playwright-report
            frontend/test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-settings-preview
          path: frontend/test-results/**/settings-*.png
          if-no-files-found: ignore
