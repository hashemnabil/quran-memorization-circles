name: ios-build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ios-build.yml'

jobs:
  ios-build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Xcode
        run: xcodebuild -version

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build web assets
        run: npm --prefix frontend run build
        env:
          VITE_API_URL: https://quran-memorization-circles.onrender.com/api
          VITE_SOCKET_URL: https://quran-memorization-circles.onrender.com

      - name: Generate iOS project
        working-directory: frontend
        run: npx cap add ios

      - name: Sync Capacitor iOS project
        working-directory: frontend
        run: npx cap sync ios

      - name: Build iOS Simulator app (unsigned)
        working-directory: frontend/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/ios-simulator-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          cd "$RUNNER_TEMP/ios-simulator-build/Build/Products/Debug-iphonesimulator"
          /usr/bin/zip -r "$GITHUB_WORKSPACE/quran-circles-ios-simulator.zip" App.app

      - name: Build unsigned iPhone device app
        working-directory: frontend/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/ios-device-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned iPhone app
        run: |
          cd "$RUNNER_TEMP/ios-device-build/Build/Products/Release-iphoneos"
          /usr/bin/zip -r "$GITHUB_WORKSPACE/quran-circles-ios-unsigned-device.zip" App.app

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quran-circles-ios-builds
          path: |
            quran-circles-ios-simulator.zip
            quran-circles-ios-unsigned-device.zip
          if-no-files-found: error
          retention-days: 7
