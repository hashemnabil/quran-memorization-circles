name: ios-release
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version (major.minor.patch)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Increasing iOS build number'
        required: true
        default: '2'
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate signing configuration and version
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import path from 'node:path';
          for (const key of ['CERTIFICATE', 'CERTIFICATE_PASSWORD', 'PROFILE', 'TEAM']) if (!process.env[key]) throw new Error(`Missing Apple signing secret: ${key}`);
          if (!/^\d+\.\d+\.\d+$/.test(process.env.VERSION_NAME) || !/^[1-9]\d*$/.test(process.env.VERSION_CODE)) throw new Error('Invalid version');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'distribution.p12'), Buffer.from(process.env.CERTIFICATE, 'base64'), { mode: 0o600 });
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'distribution.mobileprovision'), Buffer.from(process.env.PROFILE, 'base64'), { mode: 0o600 });
          NODE
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
        env:
          VITE_API_URL: https://quran-memorization-circles.onrender.com/api
          VITE_SOCKET_URL: https://quran-memorization-circles.onrender.com
      - run: npm run mobile:sync -- ios
        working-directory: frontend
      - name: Import distribution certificate and provisioning profile
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/release.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$RUNNER_TEMP/release.keychain-db"
          security list-keychain -d user -s "$RUNNER_TEMP/release.keychain-db"
          security cms -D -i "$RUNNER_TEMP/distribution.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/distribution.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "IOS_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
      - name: Archive and export signed IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -workspace frontend/ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Halaqat.xcarchive" DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_UUID" MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$VERSION_CODE" archive
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import path from 'node:path';
          const team = process.env.IOS_TEAM_ID; const profile = process.env.IOS_PROFILE_UUID;
          if (!/^[A-Z0-9]+$/.test(team) || !/^[A-Fa-f0-9-]+$/.test(profile)) throw new Error('Invalid Apple team or profile');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'ExportOptions.plist'), `<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>${team}</string><key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>org.qurancircles.app</key><string>${profile}</string></dict></dict></plist>`);
          NODE
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Halaqat.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath ios-release
      - uses: actions/upload-artifact@v4
        with:
          name: halaqat-ios-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: ios-release/*.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f -- "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/profile.plist"
