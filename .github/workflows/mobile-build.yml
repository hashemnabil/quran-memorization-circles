name: mobile-build
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Build the signed production release'
        type: boolean
        default: false
      version_name:
        description: 'Release version'
        default: '1.1.4'
      version_code:
        description: 'Increasing Android version code'
        default: '7'
jobs:
  android-debug:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build web assets for native wrapper
        run: npm --prefix frontend run build

        env:
          VITE_API_URL: https://quran-memorization-circles.onrender.com/api
          VITE_SOCKET_URL: https://quran-memorization-circles.onrender.com
          VITE_ANDROID_FCM_CONFIGURED: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
          VITE_SITE_URL: https://quran-frontend-sknr.onrender.com

      - name: Generate Android project if missing
        if: ${{ hashFiles('frontend/android/app/build.gradle') == '' }}
        working-directory: frontend
        run: npm run mobile:add:android
      - name: Sync Capacitor assets
        working-directory: frontend
        run: npm run mobile:sync -- android
      - name: Configure optional Firebase Android project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          node -e "const fs=require('fs');const value=process.env.GOOGLE_SERVICES_JSON;if(value){JSON.parse(value);fs.writeFileSync('frontend/android/app/google-services.json',value);}"
      - name: Assemble debug APK
        working-directory: frontend/android
        run: bash ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-circles-android-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  android-release-smoke:
    # PR-only signed build using a disposable key; never publish this artifact.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build web assets
        run: npm --prefix frontend run build
        env:
          VITE_API_URL: https://quran-memorization-circles.onrender.com/api
          VITE_SOCKET_URL: https://quran-memorization-circles.onrender.com
          VITE_SITE_URL: https://quran-frontend-sknr.onrender.com
      - name: Sync Capacitor assets
        working-directory: frontend
        run: npm run mobile:sync -- android
      - name: Generate disposable signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/pr-smoke.p12" -storetype PKCS12 -alias smoke -storepass smokeonly123 -keypass smokeonly123 -keyalg RSA -keysize 2048 -validity 2 -dname "CN=PR Build Smoke Test"
      - name: Verify optimized release bundle builds
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pr-smoke.p12
          ANDROID_KEYSTORE_PASSWORD: smokeonly123
          ANDROID_KEY_ALIAS: smoke
          ANDROID_KEY_PASSWORD: smokeonly123
        run: bash ./gradlew bundleRelease
      - name: Report bundle size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/android/app/build/outputs/bundle/release/app-release.aab')
          size = p.stat().st_size
          print(f'Optimized release AAB: {size / 1048576:.2f} MiB ({size:,} bytes)')
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f'### PR release build (disposable signing key)\\n\\nAAB size: **{size / 1048576:.2f} MiB** ({size:,} bytes). Not for Play Store upload.\\n')
          PY
      - name: Delete disposable signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/pr-smoke.p12"
  android-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    uses: ./.github/workflows/android-release.yml
    with:
      version_name: ${{ inputs.version_name }}
      version_code: ${{ inputs.version_code }}
    secrets: inherit
