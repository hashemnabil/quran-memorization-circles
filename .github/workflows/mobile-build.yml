name: mobile-build
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build web assets for native wrapper
        run: npm --prefix frontend run build

        env:
          VITE_API_URL: https://quran-memorization-circles.onrender.com/api
          VITE_SOCKET_URL: https://quran-memorization-circles.onrender.com

      - name: Generate Android project if missing
        if: ${{ hashFiles('frontend/android/app/build.gradle') == '' }}
        working-directory: frontend
        run: npm run mobile:add:android
      - name: Sync Capacitor assets
        working-directory: frontend
        run: npm run mobile:sync -- android
      - name: Assemble debug APK
        working-directory: frontend/android
        run: bash ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-circles-android-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
