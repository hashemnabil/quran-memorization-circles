name: mobile-ios-build
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/mobile-ios-build.yml'
  workflow_dispatch:
jobs:
  ios-simulator:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm install --prefix frontend
      - name: Build web assets for native wrapper
        run: npm --prefix frontend run build
        env:
          VITE_API_URL: https://api.example.invalid
          VITE_SOCKET_URL: https://api.example.invalid
      - name: Generate iOS project
        working-directory: frontend
        run: npx cap add ios
      - name: Sync Capacitor assets
        working-directory: frontend
        run: npx cap sync ios
      - name: Build for iOS Simulator (unsigned)
        working-directory: frontend/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Archive simulator app artifact
        run: |
          cd frontend/ios/App/build/Build/Products/Debug-iphonesimulator
          /usr/bin/zip -r "$GITHUB_WORKSPACE/quran-circles-ios-simulator.zip" App.app
      - name: Upload iOS Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: quran-circles-ios-simulator
          path: quran-circles-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
