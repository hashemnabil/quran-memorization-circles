services:
  postgres:
    image: postgres:16-alpine
    container_name: quran-circles-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quran_circles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "5432:5432"
    volumes:
      - quran_circles_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quran_circles"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  quran_circles_pgdata:
